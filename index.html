<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>QCity Protocol</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#000;color:#00ff9d;
  font-family:'Courier New',monospace;font-size:14px;overflow:hidden}

/* ==== BACKGROUND LAYERS ==== */
#shader{position:fixed;inset:0;z-index:0;opacity:0.45}
#neural{position:fixed;inset:0;z-index:1;opacity:0.6}
#matrix{position:fixed;inset:0;z-index:2;opacity:0.22}
#hexgrid{position:fixed;inset:0;z-index:3;opacity:0.06;pointer-events:none;
  background-image:linear-gradient(rgba(0,255,157,0.6) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,157,0.6) 1px,transparent 1px);
  background-size:44px 44px;animation:hexScroll 22s linear infinite}
@keyframes hexScroll{0%{background-position:0 0}100%{background-position:44px 44px}}
#radar{position:fixed;top:50%;left:50%;width:1000px;height:1000px;margin:-500px 0 0 -500px;
  border-radius:50%;z-index:4;pointer-events:none;opacity:0.1;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(0,255,157,1) 35deg,transparent 35deg);
  animation:radarSpin 5s linear infinite}
@keyframes radarSpin{to{transform:rotate(360deg)}}
#scanline{position:fixed;left:0;width:100%;height:3px;z-index:5;
  background:linear-gradient(90deg,transparent,#00ff9d,transparent);
  opacity:0.7;pointer-events:none;animation:scan 3.5s linear infinite;
  box-shadow:0 0 24px #00ff9d,0 0 10px #00ff9d}
@keyframes scan{0%{top:-5px}100%{top:100%}}
#vignette{position:fixed;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,0.92) 100%)}
#flicker{position:fixed;inset:0;z-index:7;pointer-events:none;
  background:rgba(0,255,157,0.012);animation:flick 0.12s infinite steps(2)}
@keyframes flick{0%,100%{opacity:0.2}50%{opacity:0.55}}

/* ==== APP ==== */
#app{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;
  padding:14px 14px 8px;max-width:780px;margin:0 auto}

#title{text-align:center;margin-bottom:4px;flex-shrink:0}
h1{font-size:24px;margin:0;color:#00ff9d;letter-spacing:5px;font-weight:900;
  text-shadow:0 0 14px #00ff9d,0 0 5px #00ff9d;
  position:relative;display:inline-block;animation:flickerT 4s infinite}
h1::before,h1::after{content:attr(data-text);position:absolute;top:0;left:0;
  width:100%;height:100%;overflow:hidden}
h1::before{color:#ff3366;animation:glitch1 3.4s infinite;
  clip-path:polygon(0 0,100% 0,100% 44%,0 44%)}
h1::after{color:#00bfff;animation:glitch2 3.1s infinite;
  clip-path:polygon(0 56%,100% 56%,100% 100%,0 100%)}
@keyframes flickerT{0%,96%,100%{opacity:1}97%{opacity:0.3}98%{opacity:0.9}}
@keyframes glitch1{0%,92%,100%{transform:translate(0)}
  93%{transform:translate(-4px,-2px)}95%{transform:translate(3px,1px)}
  97%{transform:translate(-2px,2px)}}
@keyframes glitch2{0%,91%,100%{transform:translate(0)}
  92%{transform:translate(4px,2px)}94%{transform:translate(-3px,-1px)}
  96%{transform:translate(2px,-2px)}}

/* ==== TYPE BANNER ==== */
#typebanner{flex-shrink:0;background:rgba(0,20,10,0.85);
  border:1px solid #00b877;border-radius:6px;padding:7px 12px;
  margin-bottom:8px;font-size:11px;color:#00ff9d;letter-spacing:1px;
  min-height:26px;display:flex;align-items:center;gap:6px}
#typebanner .prompt{color:#00ff9d;font-weight:700}
#typebanner .text{color:#00ff9d;text-shadow:0 0 6px #00ff9d}
#typebanner .cursor{display:inline-block;width:8px;height:12px;background:#00ff9d;
  animation:blink 1s steps(2) infinite;margin-left:2px;
  box-shadow:0 0 8px #00ff9d}
@keyframes blink{50%{opacity:0}}

/* ==== IP MASK BANNER ==== */
#ipbanner{flex-shrink:0;background:rgba(0,20,10,0.9);
  border:1px solid #00ff9d;border-radius:8px;padding:8px 12px;margin-bottom:8px;
  box-shadow:0 0 16px rgba(0,255,157,0.3),0 0 8px rgba(0,255,157,0.4) inset;
  font-size:11px;line-height:1.6;position:relative;overflow:hidden}
#ipbanner::before{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(0,255,157,0.08),transparent);
  transform:translateX(-100%);animation:sweep 3s infinite}
@keyframes sweep{100%{transform:translateX(100%)}}
#ipbanner .row{display:flex;justify-content:space-between;align-items:center;
  position:relative;z-index:1}
#ipbanner .label{color:#00b877;letter-spacing:1px;font-size:10px}
#ipbanner .value{color:#00ff9d;font-weight:700;font-variant-numeric:tabular-nums;
  text-shadow:0 0 8px #00ff9d;transition:opacity .2s}
#ipbanner .value.hidden{color:#ffcc00;text-shadow:0 0 8px #ffcc00}
#ipbanner .value.masking{opacity:0.4}
#ipbanner .value.traced{color:#00bfff;text-shadow:0 0 8px #00bfff}
#ipbanner .status{color:#ffcc00;font-size:9px;letter-spacing:1px;
  animation:pulse 1.4s infinite;margin-top:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}

/* ==== STATUS BAR ==== */
#statusbar{display:flex;justify-content:space-between;font-size:10px;
  color:#00b877;letter-spacing:1px;padding:6px 10px;
  background:rgba(0,20,10,0.72);border:1px solid #007a55;border-radius:6px;
  margin-bottom:10px;flex-shrink:0}
#statusbar .live{color:#00ff9d}
#statusbar .live::before{content:'● ';animation:pulse 1.2s infinite}

/* ==== STATS ==== */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;flex-shrink:0}
.stat{background:rgba(0,20,10,0.85);border:1px solid #007a55;border-radius:6px;
  padding:8px 6px;text-align:center;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:1px;
  background:linear-gradient(90deg,transparent,#00ff9d,transparent);
  animation:statline 2.4s linear infinite}
@keyframes statline{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.stat .label{font-size:8px;color:#00b877;letter-spacing:1px;margin-bottom:3px}
.stat .value{font-size:14px;font-weight:700;color:#00ff9d;
  text-shadow:0 0 8px #00ff9d;font-variant-numeric:tabular-nums}

/* ==== TERMINAL ==== */
#terminal{flex:1;min-height:0;background:rgba(0,20,10,0.9);
  border:1px solid #00ff9d;border-radius:8px;padding:12px 14px;
  font-size:12px;line-height:1.55;color:#00ff9d;overflow-y:auto;
  box-shadow:0 0 22px rgba(0,255,157,0.25) inset,0 0 16px rgba(0,255,157,0.2);
  margin-bottom:10px;scrollbar-width:thin;scrollbar-color:#00b877 transparent}
#terminal::-webkit-scrollbar{width:6px}
#terminal::-webkit-scrollbar-thumb{background:#00b877;border-radius:3px}
#terminal .line{margin-bottom:2px;word-break:break-all;opacity:0;animation:fadein .3s forwards}
@keyframes fadein{to{opacity:1}}
#terminal .ok{color:#00ff9d}
#terminal .warn{color:#ffcc00}
#terminal .err{color:#ff3366}
#terminal .info{color:#00bfff}
#terminal .dim{color:#007a55}

/* ==== BUTTONS ==== */
#btns{display:flex;gap:8px;flex-shrink:0;margin-bottom:8px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;background:rgba(0,255,157,0.08);color:#00ff9d;
  border:1px solid #00ff9d;padding:10px 8px;border-radius:6px;
  font-family:inherit;font-weight:700;cursor:pointer;font-size:10px;
  letter-spacing:2px;transition:all .2s;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(0,255,157,0.3),transparent);
  transition:left .6s}
.btn:hover{background:#00ff9d;color:#000;box-shadow:0 0 20px #00ff9d}
.btn:hover::before{left:100%}
.btn:active{transform:scale(0.97)}

#foot{text-align:center;font-size:9px;color:#007a55;letter-spacing:2px;
  flex-shrink:0;padding:4px}

@media(max-width:600px){
  h1{font-size:19px;letter-spacing:3px}
  #stats{grid-template-columns:repeat(2,1fr)}
  .btn{min-width:80px;font-size:9px;padding:9px 5px}
  #ipbanner{font-size:10px}
}
</style>
</head>
<body>

<canvas id="shader"></canvas>
<canvas id="neural"></canvas>
<canvas id="matrix"></canvas>
<div id="hexgrid"></div>
<div id="radar"></div>
<div id="scanline"></div>
<div id="vignette"></div>
<div id="flicker"></div>

<div id="app">
  <div id="title">
    <h1 data-text="QCITY PROTOCOL">QCITY PROTOCOL</h1>
  </div>

  <div id="typebanner">
    <span class="prompt">root@qcity:~$</span>
    <span class="text" id="typing"></span>
    <span class="cursor"></span>
  </div>

  <div id="ipbanner">
    <div class="row">
      <span class="label">YOUR IP</span>
      <span class="value" id="ip-real">203.***.***.47</span>
    </div>
    <div class="row">
      <span class="label">MASKED AS</span>
      <span class="value" id="ip-mask">—</span>
    </div>
    <div class="status" id="ip-status">> initializing mask…</div>
  </div>

  <div id="statusbar">
    <span class="live">SYSTEM ONLINE</span>
    <span id="clock">--:--:--</span>
    <span>NODE <span id="node">----</span></span>
  </div>

  <div id="stats">
    <div class="stat"><div class="label">ENTROPY</div><div class="value" id="s1">—</div></div>
    <div class="stat"><div class="label">PACKETS</div><div class="value" id="s2">—</div></div>
    <div class="stat"><div class="label">LATENCY</div><div class="value" id="s3">—</div></div>
    <div class="stat"><div class="label">SECURITY</div><div class="value" id="s4">—</div></div>
  </div>

  <div id="terminal">
    <div class="line info">> qcity-terminal v9.1 booting...</div>
  </div>

  <div id="btns">
    <button class="btn" onclick="triggerScan()">RUN SCAN</button>
    <button class="btn" onclick="triggerMask()">NEW MASK</button>
    <button class="btn" onclick="triggerReset()">RESET LOG</button>
  </div>

  <div id="foot">QCITY PROTOCOL · SIMULATION · NO REAL SYSTEMS</div>
</div>

<script>
"use strict";

/* ==================== UTIL ==================== */
const HEX = '0123456789abcdef';
function randHex(n){ let s=''; for(let i=0;i<n;i++) s+=HEX[Math.floor(Math.random()*16)]; return s; }
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ==================== SHADER BACKGROUND ==================== */
(function(){
  const canvas = document.getElementById('shader');
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if(!gl){ canvas.style.display = 'none'; return; }

  const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0,1); }`;
  const fs = `
    precision highp float;
    uniform float t;
    uniform vec2 r;
    void main(){
      vec2 uv = (gl_FragCoord.xy - 0.5*r) / min(r.x,r.y);
      float a = 0.0;
      for(int i=0;i<5;i++){
        float fi = float(i)+1.0;
        vec2 p = uv * fi * 1.3;
        p += vec2(sin(t*0.3+fi)*1.2, cos(t*0.25+fi)*1.2);
        a += 0.008 / abs(sin(p.x + t*0.4) + cos(p.y + t*0.3) - 0.6);
      }
      vec3 col = vec3(0.0, 1.0, 0.6) * a * 0.55;
      gl_FragColor = vec4(col, 1.0);
    }
  `;
  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s); return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const tLoc = gl.getUniformLocation(prog, 't');
  const rLoc = gl.getUniformLocation(prog, 'r');
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w; canvas.height = h;
    gl.viewport(0,0,w,h); gl.uniform2f(rLoc, w, h);
  }
  resize();
  window.addEventListener('resize', resize);
  function draw(t){ gl.uniform1f(tLoc, t*0.001); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); requestAnimationFrame(draw); }
  requestAnimationFrame(draw);
})();

/* ==================== NEURAL NETWORK ==================== */
(function(){
  const canvas = document.getElementById('neural');
  const ctx = canvas.getContext('2d');
  let W, H, nodes = [], N = 55, maxDist = 150;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    nodes = [];
    for(let i=0;i<N;i++) nodes.push({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4,
      r: 1 + Math.random()*1.5
    });
  }
  resize();
  window.addEventListener('resize', resize);
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const n of nodes){
      n.x += n.vx; n.y += n.vy;
      if(n.x<0||n.x>W) n.vx*=-1;
      if(n.y<0||n.y>H) n.vy*=-1;
    }
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        const dx = nodes[i].x-nodes[j].x;
        const dy = nodes[i].y-nodes[j].y;
        const d = Math.sqrt(dx*dx+dy*dy);
        if(d<maxDist){
          ctx.strokeStyle = 'rgba(0,255,157,'+(1-d/maxDist)*0.45+')';
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x,nodes[i].y);
          ctx.lineTo(nodes[j].x,nodes[j].y);
          ctx.stroke();
        }
      }
    }
    for(const n of nodes){
      ctx.fillStyle = '#00ff9d';
      ctx.shadowColor = '#00ff9d'; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  setInterval(draw, 33);
})();

/* ==================== MATRIX RAIN ==================== */
(function(){
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const chars = 'アカサタナハマヤラワガザダバパイキシチニヒミリギジヂビピウクスツヌフムユルグズヅブプ0123456789ABCDEF';
  let cols, drops, fontSize = 15;
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / fontSize);
    drops = new Array(cols).fill(1);
  }
  resize();
  window.addEventListener('resize', resize);
  function draw(){
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.font = fontSize + 'px monospace';
    for(let i=0;i<drops.length;i++){
      const ch = chars[Math.floor(Math.random()*chars.length)];
      const x = i*fontSize;
      const y = drops[i]*fontSize;
      ctx.fillStyle = Math.random()>0.97 ? '#b6ffd9' : '#00ff9d';
      ctx.fillText(ch, x, y);
      if(y>canvas.height && Math.random()>0.975) drops[i]=0;
      drops[i]++;
    }
  }
  setInterval(draw, 55);
})();

/* ==================== TERMINAL LOG ==================== */
const termEl = document.getElementById('terminal');
function log(msg, cls){
  const line = document.createElement('div');
  line.className = 'line' + (cls ? ' ' + cls : '');
  line.textContent = msg;
  termEl.appendChild(line);
  while(termEl.children.length > 200) termEl.removeChild(termEl.firstChild);
  termEl.scrollTop = termEl.scrollHeight;
}

/* ==================== TYPING BANNER ==================== */
const typingEl = document.getElementById('typing');
const PHRASES = [
  'ENCRYPTION STARTED',
  'HANDSHAKE COMPLETE',
  'SCANNING NETWORK ...',
  'ROUTING THROUGH NODE ' + randHex(4).toUpperCase(),
  'MASKING IDENTITY ...',
  'TUNNEL SECURED AES-256',
  'PACKETS ENCRYPTED',
  'TRACING REQUEST ...',
  'DECOY SIGNAL ACTIVE',
  'ROTATING KEYS ...',
  'HIDING TRAFFIC ...',
  'CONNECTION MASKED'
];
let phraseIdx = 0, charIdx = 0, deleting = false;

function typeLoop(){
  const p = PHRASES[phraseIdx];
  if(!deleting){
    charIdx++;
    typingEl.textContent = p.slice(0, charIdx);
    if(charIdx >= p.length){
      deleting = true;
      setTimeout(typeLoop, 1400);
      return;
    }
    setTimeout(typeLoop, 55 + Math.random()*40);
  } else {
    charIdx--;
    typingEl.textContent = p.slice(0, charIdx);
    if(charIdx <= 0){
      deleting = false;
      phraseIdx = (phraseIdx + 1) % PHRASES.length;
      setTimeout(typeLoop, 250);
      return;
    }
    setTimeout(typeLoop, 22);
  }
}
typeLoop();

/* ==================== IP MASK BANNER ==================== */
const REGIONS = ['Amsterdam','Zurich','Reykjavik','Singapore','Tokyo','Toronto',
  'Frankfurt','Stockholm','Seoul','Geneva','Luxembourg','Helsinki','Oslo','Vienna','Dublin'];
const MASK_IPS = ['185.***.***.12','91.***.***.208','77.***.***.04','45.***.***.122',
  '103.***.***.87','212.***.***.33','62.***.***.150','80.***.***.66','196.***.***.201'];

const ipMaskEl = document.getElementById('ip-mask');
const ipStatusEl = document.getElementById('ip-status');

function maskSequence(){
  ipMaskEl.className = 'value masking';
  ipStatusEl.textContent = '> masking...';
  ipMaskEl.textContent = '███████████████';
  setTimeout(() => {
    const ip = pick(MASK_IPS);
    const region = pick(REGIONS);
    ipMaskEl.textContent = ip + '  ·  ' + region;
    ipMaskEl.className = 'value hidden';
    ipStatusEl.textContent = '> IDENTITY MASKED — location: ' + region;
    log('> IP masked → ' + ip + ' (' + region + ')', 'ok');
  }, 700);
  setTimeout(() => {
    ipStatusEl.textContent = '> decoy signal active · node ' + randHex(4).toUpperCase();
  }, 2200);
}

function traceSequence(){
  ipMaskEl.className = 'value tracing';
  ipStatusEl.textContent = '> tracing route...';
  let hops = 0;
  const iv = setInterval(() => {
    ipMaskEl.textContent = '→ ' + randHex(2).toUpperCase() + '.' + randHex(2).toUpperCase() +
      ' → ' + randHex(2).toUpperCase() + '.' + randHex(2).toUpperCase() +
      ' → ' + randHex(2).toUpperCase() + '.' + randHex(2).toUpperCase();
    hops++;
    if(hops > 6){
      clearInterval(iv);
      ipMaskEl.className = 'value traced';
      ipMaskEl.textContent = 'TRACE BLOCKED — HONEYPOT';
      ipStatusEl.textContent = '> intruder redirected to decoy';
      log('> trace attempt from external node — blocked', 'warn');
      setTimeout(maskSequence, 1800);
    }
  }, 400);
}

setTimeout(maskSequence, 1500);
setInterval(() => {
  if(Math.random() > 0.65) traceSequence();
  else maskSequence();
}, 9000);

/* ==================== LIVE STATS ==================== */
let packets = 0, entropy = 8192;
function updateStats(){
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getUTCHours()).padStart(2,'0') + ':' +
    String(d.getUTCMinutes()).padStart(2,'0') + ':' +
    String(d.getUTCSeconds()).padStart(2,'0') + ' UTC';
  document.getElementById('node').textContent = randHex(4).toUpperCase();
  entropy += randInt(-40, 60);
  if(entropy < 3000) entropy = 3000;
  if(entropy > 9999) entropy = 9999;
  document.getElementById('s1').textContent = entropy;
  packets += randInt(5, 40);
  document.getElementById('s2').textContent = packets.toLocaleString();
  document.getElementById('s3').textContent = randInt(12, 90) + 'ms';
  document.getElementById('s4').textContent = randInt(96, 100) + '%';
}
setInterval(updateStats, 1000);
updateStats();

/* ==================== FAKE LOG STREAM ==================== */
const MSGS = [
  ['> handshake with node ' + randHex(4).toUpperCase() + ' ok', 'ok'],
  ['> entropy pool: ' + randInt(4000,9000) + ' bits', 'dim'],
  ['> tunnel latency: ' + randInt(12,80) + ' ms', 'dim'],
  ['> packet ' + randHex(8) + ' routed', 'info'],
  ['> checksum verified', 'ok'],
  ['> key rotation in ' + randInt(200,900) + ' s', 'dim'],
  ['> scanning subnet 10.' + randInt(0,255) + '.' + randInt(0,255) + '.0/24', 'info'],
  ['> WARN: unusual traffic on port ' + randInt(1024,65535), 'warn'],
  ['> denied request from ' + randInt(1,255) + '.' + randInt(1,255) + '.' + randInt(1,255) + '.' + randInt(1,255), 'err'],
  ['> hash ' + randHex(32), 'dim'],
  ['> session ' + randHex(16), 'info'],
  ['> crypto layer AES-256 active', 'ok'],
  ['> integrity check passed', 'ok'],
  ['> ECDSA signature valid', 'ok'],
  ['> IP mask refreshed', 'info'],
  ['> beacon: node-' + randHex(3).toUpperCase(), 'dim']
];
setInterval(() => {
  const [msg, cls] = pick(MSGS);
  log(msg, cls);
}, 700 + Math.random()*900);

/* Boot */
const boot = [
  ['> qcity-terminal v9.1', 'info'],
  ['> loading kernel modules...', 'dim'],
  ['> initializing crypto layer...', 'dim'],
  ['> AES-256-GCM: ACTIVE', 'ok'],
  ['> ECDSA secp256k1: ACTIVE', 'ok'],
  ['> IP masking engine: ONLINE', 'ok'],
  ['> secure tunnel established', 'ok'],
  ['> system ready.', 'ok']
];
boot.forEach((b, i) => setTimeout(() => log(b[0], b[1]), 250 + i * 300));

/* ==================== BUTTONS ==================== */
function triggerScan(){
  log('> ── INITIATING FULL SCAN ──', 'info');
  let steps = 0;
  const iv = setInterval(() => {
    const port = randInt(20, 9999);
    const open = Math.random() > 0.7;
    log('> probing port ' + port + ' ... ' + (open ? 'OPEN' : 'closed'), open ? 'warn' : 'dim');
    steps++;
    if(steps > 14){
      clearInterval(iv);
      log('> scan complete · ' + randInt(2, 8) + ' anomalies found', 'ok');
    }
  }, 180);
}
function triggerMask(){
  log('> ── MASKING IDENTITY ──', 'info');
  maskSequence();
}
function triggerReset(){
  termEl.innerHTML = '';
  log('> log cleared.', 'dim');
  log('> qcity-terminal ready.', 'ok');
}
</script>
